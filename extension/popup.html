<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 300px;
      font-family: 'Segoe UI', sans-serif;
      padding: 16px;
      margin: 0;
      background: #fafafa;
    }
    h2 {
      font-size: 15px;
      margin: 0 0 12px;
      color: #1a1a2e;
    }
    label {
      font-size: 12px;
      font-weight: 600;
      color: #374151;
      display: block;
      margin-bottom: 4px;
    }
    input, textarea {
      width: 100%;
      padding: 8px 10px;
      margin-bottom: 12px;
      border: 1px solid #e2e4e9;
      border-radius: 6px;
      font-size: 13px;
      box-sizing: border-box;
      font-family: inherit;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #4f46e5;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    button:disabled {
      background: #c7c9d1;
      cursor: not-allowed;
    }
    #status {
      margin-top: 10px;
      font-size: 12px;
      text-align: center;
    }
    #loginPrompt {
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }
    #loginPrompt a {
      color: #4f46e5;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <h2>📋 JobTrack Quick Add</h2>

 <div id="loggedOutView" style="display:none;">
     <p style="font-size: 12px; color: #6b7280;">
       Paste your JobTrack login token below (get it from your browser's DevTools → Application → Local Storage → "token", after logging in at
       <a href="https://job-application-tracker-sigma-seven.vercel.app/login" target="_blank">JobTrack</a>)
     </p>
     <textarea id="tokenInput" rows="3" placeholder="Paste token here"></textarea>
     <button id="saveTokenBtn">Save Token</button>
   </div>

  <div id="loggedInView" style="display:none;">
    <label>Company</label>
    <input type="text" id="company" placeholder="Company name" />

    <label>Role</label>
    <input type="text" id="role" placeholder="Job title" />

    <label>Notes (optional)</label>
    <textarea id="notes" rows="2" placeholder="e.g. Applied via LinkedIn"></textarea>

    <button id="saveBtn">Add to JobTrack</button>
    <div id="status"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
